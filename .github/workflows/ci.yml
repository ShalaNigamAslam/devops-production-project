name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      

      - name: Initialize database
        run: docker compose exec backend python -c "from app.database import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Seed database
        run: docker compose exec backend python -m app.seed

      - name: Run tests
        run: docker compose exec backend python -m pytest tests/does_not_exist.py
      
      
