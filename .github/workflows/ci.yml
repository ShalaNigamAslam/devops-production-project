name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_PASSWORD: ci_app_password
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose build backend

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          for _ in {1..30}; do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Check services
        run: docker compose ps

      - name: Initialize database
        run: docker compose exec -T backend python -c "from app.database import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Initialize test database
        run: |
          docker compose exec -T mysql sh -c \
          'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS test_appdb;"'

          docker compose exec -T mysql sh -c \
          'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON test_appdb.* TO '\''appuser'\''@'\''%'\'';"'

          docker compose exec -T backend python -c "from app.database import test_engine; from app.models import Base; Base.metadata.create_all(test_engine)"

      - name: Seed database
        run: docker compose exec -T backend python -m app.seed

      - name: Run tests
        run: docker compose exec -T backend python -m pytest

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose push backend

      - name: Diagnose services if any step fails
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color mysql
          docker compose logs --no-color backend

      - name: Log out of GitHub Container Registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
