
services:
  mysql:
    image: mysql:8.4
    container_name: project-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
    image: devops-fastapi:${IMAGE_TAG:-latest}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb


volumes:
  mysql_data:  
